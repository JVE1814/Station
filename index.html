<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101a1e">
    <title>Station</title>
    <link rel="icon" href="data:,">
  </head>
  <body>
    <main id="simulator" aria-label="Train simulator">
      <div id="world"></div>
      <div class="top-bar">
        <section class="service-panel" aria-label="Current service">
          <div class="service-line"><span id="line"></span><time id="clock"></time></div>
          <h1 id="journey">Station</h1>
          <p id="next-stop"></p>
          <p id="signal"></p>
          <div id="route-advice" hidden>
            <p id="preview-signal"></p>
            <p id="preview-limit"></p>
            <p id="grip"></p>
          </div>
          <select id="route-picker" aria-label="Passenger service" hidden></select>
        </section>
        <div class="toolbar" aria-label="View and environment">
          <div class="group" aria-label="Camera views">
            <button id="cab-view" aria-pressed="true">Cab <kbd>1</kbd></button>
            <button id="chase-view" aria-pressed="false">Chase <kbd>2</kbd></button>
            <button id="fit-network" hidden>Fit network</button>
            <select id="map-station" aria-label="Zoom to station" hidden></select>
            <button id="map-view" aria-pressed="false">Bird’s-eye <kbd>3</kbd></button>
          </div>
          <div class="group" aria-label="Weather and time">
            <button id="day">Day</button>
            <select id="quality" aria-label="Graphics preset" hidden>
              <option value="low">Low</option><option value="high">High</option><option value="ultra">Ultra</option>
            </select>
            <button id="weather">Clear</button>
            <button id="compression">1×</button>
            <button id="pause" aria-pressed="false">Pause <kbd>P</kbd></button>
          </div>
        </div>
      </div>
      <p class="notice" id="notice" role="status">Loading service…</p>
      <aside id="training" class="driver-card" hidden aria-live="polite">
        <h2 id="training-title"></h2><p id="training-step"></p><small id="training-progress"></small>
      </aside>
      <aside id="trip-result" class="driver-card" hidden aria-live="polite">
        <h2 id="result-title"></h2><strong id="result-score"></strong>
        <p id="result-timing"></p><p id="result-position"></p><p id="result-passengers"></p>
        <button id="hide-result">Dismiss</button>
      </aside>
      <div class="bottom-bar">
        <section class="speed-panel" aria-label="Train speed">
          <span id="speed">0</span><span class="units">km/h</span>
          <span class="limit" id="limit" title="Line speed limit">—</span>
          <span id="brake-cue" hidden></span>
        </section>
        <section class="controls-panel" aria-label="Driving controls">
          <div class="control"><span>Power</span><button id="less-power" aria-label="Reduce power"><kbd>S</kbd></button><meter id="power" min="0" max="1"></meter><output id="power-notch" hidden></output><button id="more-power" aria-label="Increase power"><kbd>W</kbd></button></div>
          <div class="control"><span>Brake</span><button id="less-brake" aria-label="Release brake"><kbd>Q</kbd></button><meter id="brake" min="0" max="1"></meter><output id="brake-notch" hidden></output><button id="more-brake" aria-label="Apply brake"><kbd>E</kbd></button></div>
        </section>
        <div class="group auxiliary" aria-label="Auxiliary controls">
          <button id="doors">Doors <kbd>D</kbd></button>
          <button id="horn">Horn <kbd>H</kbd></button>
          <button id="tutorial" hidden>Practice <kbd>L</kbd></button>
          <button id="retry" hidden>Retry <kbd>R</kbd></button>
          <button id="mute" aria-pressed="false" hidden>Sound</button>
          <button id="auto" aria-pressed="false">Auto <kbd>A</kbd></button>
        </div>
      </div>
      <details class="help"><summary>Controls</summary><p>Drag to look around. Scroll to zoom. Use 1–3 to switch cameras. Time compression cycles from 1× to 5×.</p></details>
      <small class="attribution" id="geo-credits">© OpenStreetMap contributors · Copernicus DEM</small>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
